<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Meu Repertório: músicas, cifras e repertórios para violão, com funcionamento offline."
    />
    <meta name="application-name" content="Meu Repertório" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meu Repertório" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      (function () {
        var mode = 'system';
        try {
          var saved = localStorage.getItem('meu-repertorio:appearance');
          if (saved === 'light' || saved === 'dark' || saved === 'system') mode = saved;
        } catch (_) {}
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var isStage = /^#\/?show(?:\/|$)/.test(location.hash);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isStage || dark ? '#0b0c0e' : '#f5f5f7');
      })();
    </script>
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/icon-192.png" />
    <title>Meu Repertório</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para usar o Meu Repertório.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
